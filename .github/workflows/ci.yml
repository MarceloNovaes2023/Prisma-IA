name: CI (Cloudflare Workers)

# Disparado automaticamente por push e pull request no main.
# Só valida compilação e typecheck; não publica nada.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Build + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Worker (OpenNext)
        run: npm run build:worker
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          NEXT_TELEMETRY_DISABLED: "1"
