name: OpenNext build (Cloudflare)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build OpenNext (Cloudflare worker + assets)
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
      - name: Pack build artefacts
        run: |
          set -e
          mkdir -p artefact
          cp -r freebuff-sites-build artefact/
          if [ -d .open-next/assets ]; then cp -r .open-next/assets artefact/.open-next/assets; fi
          cp wrangler.jsonc open-next.config.ts package.json artefact/
          cd artefact && zip -r ../build-artifact.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: opennext-build
          path: build-artifact.zip
          retention-days: 7
