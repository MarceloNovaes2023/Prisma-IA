name: Build (Cloudflare Workers)

# Só valida a compilação no runner do GitHub, sem publicar nada.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build OpenNext
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Worker (OpenNext)
        run: npm run build:worker
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Empacotar build
        run: |
          set -euo pipefail
          zip -qr opennext-build.zip .open-next

      - uses: actions/upload-artifact@v4
        with:
          name: opennext-build
          path: opennext-build.zip
          retention-days: 7
