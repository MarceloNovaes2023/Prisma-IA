name: Deploy (Cloudflare Workers)

# Build roda no runner do GitHub (7 GB de RAM), não na máquina local.
# Disparo manual de propósito: publicar exige autorização explícita.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OpenNext
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Worker (OpenNext)
        run: npm run build:worker
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Guardar saída do build
        uses: actions/upload-artifact@v4
        with:
          name: opennext-output
          # a raiz do artefato é o próprio .open-next, então o download restaura igual
          path: .open-next
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy Worker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebaixar build do job anterior
        uses: actions/download-artifact@v4
        with:
          name: opennext-output
          path: .open-next

      - name: Verificar credenciais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Faltam os secrets CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID no repositório."
            exit 1
          fi

      - name: Aplicar schema do app na D1 (se precisar)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SCHEMA_JSON=$(node scripts/extract-app-schema.cjs)
          SCHEMA=$(node -e "process.stdout.write(JSON.parse(${SCHEMA_JSON}))")

          # D1 atualiza o schema com CREATE IF NOT EXISTS / CREATE INDEX IF NOT EXISTS,
          # então rodar idempotentemente não quebra nada. Só falha de fato se o binding/account
          # não existir ou a token não tiver escopo D1: onde não conseguimos aplicar, o deploy
          # Workers em si simplesmente não subiria de qualquer jeito, então este passo é um early fail.
          echo "$SCHEMA" | npx wrangler d1 execute --remote DB --stdin

      - name: Publicar no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ci.jsonc
